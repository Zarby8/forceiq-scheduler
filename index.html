<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForceIQ – Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>FORCEIQ SCHEDULER</h1>
        <div class="tag">Electric analytics. Precision scheduling.</div>
      </header>

      <section class="card">
        <div id="welcome"></div>
        <div class="grid">
          <div>
            <label>Full Name</label>
            <input id="name" placeholder="Jane Appleseed" />
          </div>
          <div>
            <label>Email</label>
            <input id="email" placeholder="jane@example.com" />
          </div>
          <div>
            <label>Phone (optional)</label>
            <input id="phone" placeholder="+1 555 123 4567" />
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Pick a Slot</h2>
        <div class="week-nav">
          <button id="prevWeek">◀ Prev Week</button>
          <div id="weekLabel"></div>
          <button id="nextWeek">Next Week ▶</button>
        </div>
        <div id="calendar" class="calendar-container">
          <table class="calendar-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
                <th>Sun</th>
              </tr>
            </thead>
            <tbody id="timeSlots">
            </tbody>
          </table>
        </div>
        <div id="slots" class="slots" style="display: none;"></div>
      </section>

      <section class="card">
        <h2>Session Details</h2>
        <div class="questions-grid">
          <div class="question-block">
            <label>Game Request</label>
            <input id="q_game" placeholder="Which game do you want analyzed? (ie U-16 Honeybaked)" />
          </div>
          <div class="question-block">
            <label>Date</label>
            <div class="date-inputs">
              <select id="q_month">
                <option value="1">January</option>
                <option value="2">February</option>
                <option value="3">March</option>
                <option value="4">April</option>
                <option value="5">May</option>
                <option value="6">June</option>
                <option value="7">July</option>
                <option value="8">August</option>
                <option value="9">September</option>
                <option value="10">October</option>
                <option value="11">November</option>
                <option value="12">December</option>
              </select>
              <select id="q_day"></select>
              <select id="q_year"></select>
            </div>
          </div>
          <div class="question-block">
            <label>Time</label>
            <div class="time-inputs">
              <input id="q_time" placeholder="Game time (e.g., 7:30 PM)" />
              <select id="q_timezone">
                <option value="America/New_York">Eastern Time</option>
                <option value="America/Chicago">Central Time</option>
                <option value="America/Denver">Mountain Time</option>
                <option value="America/Los_Angeles">Pacific Time</option>
                <option value="America/Anchorage">Alaska Time</option>
                <option value="America/Halifax">Atlantic Time</option>
              </select>
            </div>
          </div>
          <div class="question-block">
            <label>Rate Performance (1-10)</label>
            <select id="q_rating">
              <option value="">Select rating...</option>
              <option value="1">1 - Poor</option>
              <option value="2">2 - Below Average</option>
              <option value="3">3 - Below Average</option>
              <option value="4">4 - Fair</option>
              <option value="5">5 - Average</option>
              <option value="6">6 - Above Average</option>
              <option value="7">7 - Good</option>
              <option value="8">8 - Very Good</option>
              <option value="9">9 - Excellent</option>
              <option value="10">10 - Outstanding</option>
            </select>
          </div>
          <div class="question-block full">
            <label>Focus</label>
            <textarea id="q_focus" placeholder="What would you like me to focus on? (Be detailed and descriptive for WHY)" rows="3"></textarea>
          </div>
          <div class="question-block full">
            <label>Performance</label>
            <textarea id="q_performance" placeholder="How did you think you played? (Be detailed and descriptive for WHY)" rows="3"></textarea>
          </div>
          <div class="question-block full">
            <label>Events (Optional)</label>
            <textarea id="q_events" placeholder="Is there anything I should know that happened? (ie You got sat, not on the PP, coach changed lines)" rows="2"></textarea>
          </div>
          <div class="question-block">
            <label>Source</label>
            <select id="q_source">
              <option value="">Select source...</option>
              <option value="Livebarn">Livebarn</option>
              <option value="YouTube">YouTube</option>
              <option value="InStat">InStat</option>
              <option value="SportLogiq">SportLogiq</option>
              <option value="Hudl">Hudl</option>
              <option value="TPE">TPE</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="question-block" id="source-other-container" style="display: none;">
            <label>Other Source</label>
            <input id="q_source_other" placeholder="Please specify the source" />
          </div>
        </div>
      </section>

      <section class="card actions">
        <button id="submit" class="cta">Confirm Booking</button>
        <div id="status" class="status"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
  </html>
