<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ForceIQ – Schedule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Racing+Sans+One&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>FORCEIQ SCHEDULER</h1>
        <div class="tag">Electric analytics. Precision scheduling.</div>
      </header>

      <section class="card">
        <div id="welcome"></div>
        <div class="grid">
          <div>
            <label>Full Name</label>
            <input id="name" placeholder="Jane Appleseed" />
          </div>
          <div>
            <label>Email</label>
            <input id="email" placeholder="jane@example.com" />
          </div>
          <div>
            <label>Phone (optional)</label>
            <input id="phone" placeholder="+1 555 123 4567" />
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Pick a Slot</h2>
        <div class="week-nav">
          <button id="prevWeek">◀ Prev</button>
          <div id="weekLabel"></div>
          <button id="nextWeek">Next ▶</button>
        </div>
        <div id="slots" class="slots"></div>
      </section>

      <section class="card">
        <h2>Session Details</h2>
        <div class="questions-grid">
          <div class="question-block">
            <label>Game Analysis Request</label>
            <input id="q_game" placeholder="Jan 15 vs Falcons (U18 AAA)" />
          </div>
          <div class="question-block">
            <label>Video Source</label>
            <input id="q_video" placeholder="YouTube • Hudl • Drive Link" />
          </div>
          <div class="question-block">
            <label>Focus Areas</label>
            <input id="q_focus" placeholder="Deception forehand • Edgework • Pressure plays" />
          </div>
          <div class="question-block">
            <label>Additional Notes</label>
            <input id="q_constraints" placeholder="Travel schedule • Injuries • Priorities" />
          </div>
        </div>
      </section>

      <section class="card actions">
        <button id="submit" class="cta">Confirm Booking</button>
        <div id="status" class="status"></div>
      </section>
    </div>

    <script src="app.js"></script>
  </body>
  </html>
